# RocketRPG build of mkxp-z 2.4.2 (upstream a5d5749), Windows x64 only.
# Changes from upstream CI: current action versions, Windows job only, a list of the exact
# dependency sources, and on a rocketrpg-* tag a GitHub release with the build and those sources.
name: Automatic Build

on:
  push:
    branches: ['rocketrpg']
    tags: ['rocketrpg-*']
    paths-ignore: ['*.md', '*.json', '*.png']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - name: Short SHA
        id: short-sha
        shell: bash
        run: echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: msys2/setup-msys2@v2
        with:
          msystem: mingw64
          # zip is just used for artifact compression at the end.
          install: >-
            base-devel
            git
            ruby
            vim
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-meson
            mingw-w64-x86_64-autotools
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-zlib
            zip

      - name: Checkout repository
        uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: |
            windows/build-mingw64
            windows/downloads
          key: win-${{ hashFiles('windows/Makefile') }}

      - name: Build all dependencies
        shell: msys2 {0}
        run: |
          cd windows
          make

      - name: List dependency sources
        shell: msys2 {0}
        run: |
          out=windows/deps-sources.txt
          echo "mkxp-z $(git rev-parse HEAD)" > $out
          echo "" >> $out
          echo "# Libraries built from source (windows/Makefile), repository and exact commit" >> $out
          for d in windows/downloads/mingw64/*/; do
            if [ -d "$d/.git" ]; then
              echo "$(basename $d) $(git -C $d remote get-url origin) $(git -C $d rev-parse HEAD)" >> $out
            fi
          done
          echo "" >> $out
          echo "# MSYS2 packages used (toolchain, zlib1.dll), source at https://packages.msys2.org/" >> $out
          pacman -Q mingw-w64-x86_64-gcc mingw-w64-x86_64-zlib mingw-w64-x86_64-meson >> $out
          cat $out

      - name: Build exe
        shell: msys2 {0}
        run: |
          source windows/vars.sh
          meson setup build -Dc_std=gnu17
          cd build
          ninja
          strip ./mkxp-z.exe

      - name: Prepare archive
        shell: msys2 {0}
        run: |
          mkdir build/artifact
          cd build/artifact
          cp /mingw64/bin/zlib1.dll .
          cp ../../windows/build-mingw64/bin/x64-msvcrt-ruby310.dll .
          cp -r ../../windows/build-mingw64/lib/ruby/3.1.0 .
          mv ./3.1.0 ./stdlib
          cp ../mkxp-z.exe .
          cp ../../mkxp.json .
          cp -r ../../scripts .
          cp ../../assets/LICENSE.mkxp-z-with-https.txt .
          cp ../../windows/deps-sources.txt .
          cd ..
          # Zipping before uploading decreases the upload time considerably.
          # Unfortunately this results in double-zipping; tracked at:
          # https://github.com/actions/upload-artifact/issues/426
          zip -r artifact.zip artifact

      - uses: actions/upload-artifact@v4
        with:
          name: mkxp-z.windows.${{github.ref_name}}-${{steps.short-sha.outputs.sha}}
          path: build/artifact.zip

      - name: Pack dependency sources
        if: startsWith(github.ref, 'refs/tags/rocketrpg-')
        shell: msys2 {0}
        run: |
          mkdir -p build/deps-source
          for d in windows/downloads/mingw64/*/; do
            if [ -d "$d/.git" ]; then
              n=$(basename $d)
              git -C $d archive --format=tar.gz --prefix=$n/ -o "$PWD/build/deps-source/$n.tar.gz" HEAD
            fi
          done
          cp windows/deps-sources.txt build/deps-source/
          cd build
          zip -r -0 deps-source.zip deps-source

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/rocketrpg-')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          cp build/artifact.zip "mkxp-z-${tag}-win64.zip"
          cp build/deps-source.zip "mkxp-z-${tag}-deps-source.zip"
          notes="mkxp-z 2.4.2 (upstream a5d5749) built by GitHub Actions for RocketRPG.
          Source: this tag. Exact sources of the libraries built into it: deps-source zip (list in deps-sources.txt)."
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --title "$tag" --notes "$notes" \
            "mkxp-z-${tag}-win64.zip" "mkxp-z-${tag}-deps-source.zip"
